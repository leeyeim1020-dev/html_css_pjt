<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INDEX03</title>
</head>
<body>

    <!-- 
    ul, ol, li - 목록(리스트)
    -->
    <ul>
        <li>짜장면</li>
        <li>짬뽕</li>
        <li>우동</li>
        <li>탕수육</li>
    </ul>

     <ol>
        <li>짜장면</li>
        <li>짬뽕</li>
        <li>우동</li>
        <li>탕수육</li>
    </ol>

    <!-- 
    dl, dt, dd
    -->
    <dl>
        <dt>HTML</dt>
        <dd>웹 문서를 구조화하는 마크업 언어</dd>

        <dt>CSS</dt>
        <dd>웹 문서의 디자인을 담당하는 스타일 시트 언어</dd>
    </dl>
</body>
</html>
