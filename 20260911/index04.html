<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INDEX04</title>
</head>
<body>
    <!-- 
    form(양식) 태그
    -->
    <form
        action="서버 URL"
        method="post">
        <input type="text" placeholder="회원 ID 입력하세요."><br>
        <input type="password" placeholder="회원 PW 입력하세요."><br>
        <input type="email" placeholder="회원 MAIL 입력하세요."><br>
        <input type="number" placeholder="회원 AGE 입력하세요."><br>
        <input type="file"><br>
        <input type="date"><br>
        <input type="datetime-local"><br>
        <select>
            <option>한국</option>
            <option>미국</option>
            <option>영국</option>
            <option>일본</option>
            <option>중국</option>
        </select><br>
        <input type="checkbox" name="hobby">축구
        <input type="checkbox" name="hobby">농구
        <input type="checkbox" name="hobby">배구
        <input type="checkbox" name="hobby">수구
        <input type="checkbox" name="hobby">탁구
        <br>
        <input type="radio" name="gender">남자
        <input type="radio" name="gender">여자
        <br>
        <input type="color"><br>
        <input type="range" max="10" min="0" step="2" value="2"><br>
        <textarea></textarea><br>
        <input type="button" value="회원가입">
        <input type="reset" value="초기화">
    </form>

</body>
</html>
